[package]
name = "framebatch"
version = "0.9.0"
edition = "2024"
default-run = "framebatch"

[features]
test-hooks = []

[lib]
name = "framebatch_core"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
jpeg-encoder = { version = "0.7.1", features = ["simd"] }
png = "0.18"
kamadak-exif = "0.6"
lcms2 = { version = "6", features = ["static"] }
rayon = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
tempfile = "3"
blake3 = "1"
quick-xml = "0.42"
base64 = "0.22"
walkdir = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_SystemInformation"] }

[profile.release]
lto = "thin"
codegen-units = 1
